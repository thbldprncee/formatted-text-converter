name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, verify coverage
        run: ./gradlew build --no-daemon

      - name: Convert the assignment example
        run: |
          java -jar build/libs/formatted-text-converter-1.0.0.jar examples/task-example.md /tmp/out.json
          diff /tmp/out.json examples/task-example.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html

      - uses: actions/upload-artifact@v4
        with:
          name: textconv-jar
          path: build/libs/*.jar
